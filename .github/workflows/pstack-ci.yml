name: pstack CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Skill and port checks
        run: python3 pstack/port/check.py
      - name: Unit tests
        run: python3 -m unittest discover -s pstack/port/tests -p 'test_*.py' -v
      - name: Python compiles
        run: python3 -m py_compile pstack/port/*.py pstack/port/pstack pstack/port/smoke/smoke.py
      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck

  bun:
    name: poteto-mode script tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pstack/skills/poteto-mode/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun test orch watch-pr

  install:
    name: Install (ubuntu-latest, bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pstack/port/tests/install_test.sh
      - name: pstack command, bootstrap, and update
        run: python3 -m unittest pstack/port/tests/test_cli.py
      - name: worktree-audit.sh with this runner's stat and date
        run: python3 -m unittest pstack/port/tests/test_worktree_audit.py

  gate:
    name: CI gate
    needs: [checks, bun, install]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do [[ $result == success ]] || exit 1; done

  release:
    name: Release
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pstack-release
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release this commit unless a tag already covers it
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 pstack/port/release.py --publish --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
